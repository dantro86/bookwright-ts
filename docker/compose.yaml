# Deterministic local stand. Started only through scripts/local-stand.sh, which assigns a unique
# project name, generates the SSH client key, waits for health checks, pins the bastion host key,
# discovers the dynamic host ports and always tears everything down (containers, volumes, networks).
#
# Credentials below are non-production demo values, documented in README.
services:
  restful-booker:
    # Published image is linux/amd64 only; Apple Silicon runs it under emulation.
    image: mwinteringham/restfulbooker@sha256:e4a04233731ceca2e6d99bca16689e0d4bc44631047ab351b6f11b5fa08fb418
    platform: linux/amd64
    ports:
      # Loopback only, dynamic host port: parallel stands never collide.
      - '127.0.0.1::3001'
    networks: [edge]
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', 'http://localhost:3001/ping']
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_ROOT_PASSWORD: root-demo-not-a-secret
      MYSQL_DATABASE: bookwright
      MYSQL_USER: bookwright
      MYSQL_PASSWORD: bookwright-demo-not-a-secret
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    # No published port: MySQL is reachable only inside the private backend network.
    networks: [backend]
    healthcheck:
      # TCP ping fails during initialization (the init server skips networking), so "healthy"
      # means schema and seed are applied.
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  bastion:
    build: ./bastion
    environment:
      BASTION_AUTHORIZED_KEY: ${BASTION_AUTHORIZED_KEY:?generated by scripts/local-stand.sh}
      # Optional loopback-only demo of password authentication; empty disables it.
      BASTION_PASSWORD: ${BASTION_PASSWORD:-}
    ports:
      - '127.0.0.1::2222'
    networks: [edge, backend]
    depends_on:
      mysql:
        condition: service_healthy

  local-app:
    build:
      context: ..
      dockerfile: local-app/Dockerfile
    environment:
      PORT: '3000'
      SESSION_TTL_SECONDS: '3600'
      SEED_USER_EMAIL: demo.user@bookwright.test
      SEED_USER_PASSWORD: demo-password-not-a-secret
      SEED_USER_NAME: Demo User
      DB_HOST: mysql
      DB_NAME: bookwright
      DB_USER: bookwright
      DB_PASSWORD: bookwright-demo-not-a-secret
    ports:
      - '127.0.0.1::3000'
    networks: [edge, backend]
    depends_on:
      mysql:
        condition: service_healthy

networks:
  edge: {}
  # `internal`: no route to the outside world and no published ports.
  backend:
    internal: true

volumes:
  mysql-data: {}
