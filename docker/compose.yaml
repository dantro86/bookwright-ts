# Deterministic local stand. Started only through scripts/local-stand.sh, which assigns a unique
# project name, waits for health checks, discovers the dynamic host ports and always tears down.
services:
  restful-booker:
    # Published image is linux/amd64 only; Apple Silicon runs it under emulation.
    image: mwinteringham/restfulbooker@sha256:e4a04233731ceca2e6d99bca16689e0d4bc44631047ab351b6f11b5fa08fb418
    platform: linux/amd64
    ports:
      # Loopback only, dynamic host port: parallel stands never collide.
      - '127.0.0.1::3001'
    networks: [stand]
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', 'http://localhost:3001/ping']
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

networks:
  stand: {}
