name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches drift in external targets (restful-booker, Sauce Demo) and new advisories.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  # Pinned in package-lock.json; browsers are installed explicitly per job.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lockfile integrity
        run: npm run lockfile:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Configuration validation
        run: |
          BW_STAND=prod npm run config:check
          # The local stand must fail fast with an actionable report when the launcher did not run.
          if BW_STAND=local npm run config:check; then
            echo "expected config:check to reject an unconfigured local stand" >&2
            exit 1
          fi
      - name: Whitespace errors
        # Empty-tree diff: checks every tracked file, not only the latest commit.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  self-tests:
    name: Framework self-tests + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Self-tests with coverage gate
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-framework
          path: allure-results/
          if-no-files-found: ignore
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-framework
          path: test-results/
          if-no-files-found: ignore

  scenarios:
    name: Scenarios (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui, db, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run on an isolated local stand
        run: npm run stand:local -- npx playwright test --project=${{ matrix.project }}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore

  stand-isolation:
    name: Concurrent stand isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Two stands at once
        run: npm run stand:concurrency

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  quality-gate:
    name: Quality gate
    if: always()
    needs: [static, self-tests, scenarios, stand-isolation, codeql, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Dependency review runs only for pull requests; everything else must succeed.
          failed=$(echo "${NEEDS}" | jq -r 'to_entries[]
            | select(.value.result != "success")
            | select(.key != "dependency-review" or .value.result != "skipped")
            | .key')
          if [ -n "${failed}" ]; then
            echo "::error::quality gate failed: ${failed//$'\n'/, }"
            exit 1
          fi

  report:
    name: Allure report
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [self-tests, scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Merge raw results from every job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Restore history from the published report
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p allure-history
          curl --fail --silent --show-error --location "${PAGES_URL}/history/history.jsonl" \
            --output allure-history/history.jsonl || echo "no previous history; starting a new one"
      - name: Generate report
        run: |
          npx allure generate allure-results
          mkdir -p allure-report/history
          cp allure-history/history.jsonl allure-report/history/history.jsonl
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report

  deploy-report:
    name: Publish report
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
